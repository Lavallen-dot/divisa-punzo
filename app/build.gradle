plugins {
    id 'com.android.application'
}

android {
    namespace 'ar.divisapunzo.juego'
    compileSdk 34

    defaultConfig {
        applicationId "ar.divisapunzo.juego"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Sin dependencias externas: la app es sólo un WebView que muestra el juego (assets/www)
